# Labels Dependabot PRs by security/scope and auto-merges low-risk security fixes once
# required checks pass (needs branch protection with required status checks).
name: dependabot-triage

on: pull_request

permissions:
  contents: write
  pull-requests: write
  issues: write # creating labels goes through the Issues API

jobs:
  triage:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Every security update is routed into a `*-security-*` group in dependabot.yml, so the
      # branch name is a reliable security signal even when alert-lookup can't read alerts.
      IS_SECURITY: ${{ contains(github.head_ref, '-security-') }}
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          # Optional: fills ghsa-id / cvss. GITHUB_TOKEN can't read Dependabot alerts; add a token
          # with "Dependabot alerts: read" as a *Dependabot* secret (Actions secrets aren't exposed
          # to Dependabot-triggered runs).
          alert-lookup: true
          github-token: ${{ secrets.DEPENDABOT_ALERTS_TOKEN || secrets.GITHUB_TOKEN }}

      # dependency-type is "direct:production", "direct:development" or "indirect".
      - name: Label
        run: |
          scope="scope:${{ steps.meta.outputs.dependency-type }}"
          gh label create "$scope" --color c5def5 --force
          labels="$scope"
          if [ "$IS_SECURITY" = "true" ] || [ -n "${{ steps.meta.outputs.ghsa-id }}" ]; then
            gh label create security --color d93f0b --force
            labels="$labels,security"
          fi
          gh pr edit "$PR" --add-label "$labels"

      - name: Auto-merge non-major security fixes
        if: (env.IS_SECURITY == 'true' || steps.meta.outputs.ghsa-id != '') && steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR"
